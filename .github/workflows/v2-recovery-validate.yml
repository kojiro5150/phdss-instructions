name: PHDSS v2 Recovery Validation

on:
  push:
    branches:
      - v2.0
  pull_request:
    branches:
      - main
    paths:
      - "App_FINAL.jsx"
      - ".github/scripts/validate-v2.mjs"
      - ".github/workflows/v2-recovery-validate.yml"

jobs:
  validate-recovery-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install parser
        run: npm install --no-save --no-package-lock @babel/parser

      - name: Validate recovered JSX and contracts
        run: node .github/scripts/validate-v2.mjs
